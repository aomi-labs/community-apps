[app]
name = "dottie"
display_name = "Sol Dottie"
public = true

# Public research only. Wallet/account tools and direct trading shortcuts stay
# outside this allowlist so the host can continue personal requests in DMs.
[bot.group]
enabled = true
tools = [
    "dottie_signals",
    "dottie_scan",
    "dottie_find",
    "dottie_token",
    "dottie_people",
    "dottie_chart",
    "dottie_trades",
    "dottie_holders",
    "dottie_exit",
    "dottie_check",
    "dottie_assets",
    "dottie_fluxbeam_quote",
    "dottie_solomon_product",
    "svm-reads",
    "web",
]

# Provision a managed Solana wallet per user on first use. The bot's
# own connection starts Instant; users can switch to Ask in /wallet.
[wallets]
agent = true
create = true
families = ["svm"]
suggest = "instant"

# Telegram shortcuts: the host runs these direct tools without the model.
# A pasted Solana mint opens its card with buy and sell buttons.
[[shortcuts]]
pattern = '^\s*([1-9A-HJ-NP-Za-km-z]{32,44})\s*$'
tool = "dottie_preview"
arg = "token"

[[shortcuts]]
command = "buy"
tool = "dottie_buy"
arg = "text"
description = "Buy a token: /buy <mint> <SOL amount>"

[[shortcuts]]
command = "sell"
tool = "dottie_sell"
arg = "text"
description = "Sell a token: /sell <mint> <amount or %>"

[[shortcuts]]
command = "positions"
tool = "dottie_positions_view"
arg = "text"
description = "Your holdings"

[[shortcuts]]
command = "settings"
tool = "dottie_settings_view"
arg = "text"
description = "Your quick-buy and sell buttons"
