[app]
name = "hoodit"
display_name = "Hoodit"
public = true

# Each user gets an agent wallet for Hoodit on /start (and may make more).
# Its lane decides how a committed trade signs: Instant at once, or an
# Approve card in the chat. New connections start on Instant.
[wallets]
agent = true
create = true
families = ["evm"]
suggest = "instant"

# Telegram shortcuts: the host runs these direct tools without the model.
[[shortcuts]]
pattern = '^\s*(0x[0-9a-fA-F]{40})\s*$'
tool = "hoodit_preview"
arg = "token"

[[shortcuts]]
command = "buy"
tool = "hoodit_buy"
arg = "text"
description = "Buy a token: /buy <address> <amount>"

[[shortcuts]]
command = "sell"
tool = "hoodit_sell"
arg = "text"
description = "Sell a token: /sell <address> <amount or %>"

[[shortcuts]]
command = "positions"
tool = "hoodit_positions_view"
arg = "text"
description = "Your holdings"

[[shortcuts]]
command = "settings"
tool = "hoodit_settings_view"
arg = "text"
description = "Your quick-buy and sell buttons"
