[package]
name = "stratex-backend"
version = "0.1.0"
edition = "2021"

[lib]
name = "stratex_backend"
crate-type = ["cdylib"]

[dependencies]
aomi-sdk = "=3.0.1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"], default-features = false }
tokio = { version = "1", features = ["full"] }
