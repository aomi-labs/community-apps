[package]
name    = "playground-example"
version = "0.1.0"
edition = "2024"
publish = false

# Aomi plugins are dynamically loaded by the backend — they MUST be a cdylib.
[lib]
crate-type = ["cdylib"]

[dependencies]
# Pin EXACTLY to the backend runtime version. The deploy preflight rejects any
# mismatch, including patch releases.
aomi-sdk   = "=3.1.0"
schemars   = "1"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Tools run inside a synchronous FFI boundary — there is no async runtime inside
# the plugin. When you need HTTP, use reqwest's blocking client:
# reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
