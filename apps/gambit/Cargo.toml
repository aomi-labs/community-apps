[package]
name = "gambit"
version = "0.1.0"
edition = "2024"
description = "Gambit — multi-source football betting intelligence plugin for prediction markets"

[lib]
crate-type = ["cdylib"]

[dependencies]
aomi-sdk = "=0.1.20"
aomi-ext = { git = "https://github.com/aomi-labs/aomi-sdk", rev = "25596f006e36bd1a6246940e3a8dfb30d4dc5ca2", features = ["hmac-auth"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
schemars = "1.0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
